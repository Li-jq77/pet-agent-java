<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{pets/base}">
<head>
    <title>📋 确认订单 - 里脊球的宠物店</title>
    <th:block layout:fragment="extraCss">

    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
<div class="checkout-page" style="padding:2rem;max-width:700px;margin:0 auto;">
    <h1 style="font-size:1.5rem;color:var(--brown);margin-bottom:0.3rem;">📋 确认订单</h1>
    <p style="color:var(--text-light);margin-bottom:1.5rem;">填写收货信息，为毛孩子们下单吧 🎁</p>

    <div style="background:white;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 12px var(--shadow);">
        <h3 style="font-size:1rem;color:var(--brown);margin-bottom:0.8rem;">🛒 商品清单</h3>
        <th:block th:each="item : ${cartItems}">
        <div class="checkout-item" style="display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.9rem;border-bottom:1px solid #f5f5f5;">
            <span><th:block th:if="${item.dog}">[[${item.dog.name}]]</th:block><th:block th:unless="${item.dog}">[[${item.product.name}]]</th:block> × [[${item.quantity}]]</span>
            <span style="font-weight:600;color:var(--coral);">¥<span th:if="${item.dog}" th:text="${item.dog.price}"></span><span th:unless="${item.dog}" th:text="${#numbers.formatDecimal(item.product.price * item.quantity,1,2)}"></span></span>
        </div>
        </th:block>
        <div style="display:flex;justify-content:space-between;padding-top:0.8rem;font-size:1.1rem;">
            <span style="font-weight:600;">合计</span>
            <span style="font-weight:700;color:var(--coral);font-size:1.3rem;">¥[[${#numbers.formatDecimal(total,1,2)}]]</span>
        </div>
    </div>

    <form method="post" style="background:white;border-radius:16px;padding:1.5rem;box-shadow:0 2px 12px var(--shadow);">
        <h3 style="font-size:1rem;color:var(--brown);margin-bottom:0.8rem;">📮 收货信息</h3>
        <div style="margin-bottom:1rem;">
            <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.3rem;">联系电话</label>
            <input type="tel" name="phone" required style="width:100%;padding:0.7rem 1rem;border:1.5px solid #eee;border-radius:12px;font-size:0.95rem;outline:none;background:var(--cream);" placeholder="请输入手机号码">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.3rem;">收货地址</label>
            <textarea name="address" required rows="3" style="width:100%;padding:0.7rem 1rem;border:1.5px solid #eee;border-radius:12px;font-size:0.95rem;outline:none;background:var(--cream);resize:vertical;" placeholder="请输入详细收货地址"></textarea>
        </div>
        <button type="submit" style="width:100%;padding:0.8rem;background:linear-gradient(135deg,var(--pink),var(--coral));color:white;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;">💳 确认下单</button>
    </form>

    <div style="text-align:center;margin-top:1rem;">
        <a th:href="@{/cart/}" style="color:var(--pink);text-decoration:none;font-size:0.9rem;">← 返回购物车</a>
    </div>
</div>
    </th:block>
    <th:block layout:fragment="extraJs">

    </th:block>
</body>
</html>
