<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{pets/base}">
<head>
    <title>📦 我的订单 - 里脊球的宠物店</title>
    <th:block layout:fragment="extraCss">

    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
<div class="orders-page" style="padding:2rem;max-width:800px;margin:0 auto;">
    <h1 style="font-size:1.5rem;color:var(--brown);margin-bottom:0.3rem;">📦 我的订单</h1>
    <p style="color:var(--text-light);margin-bottom:1.5rem;">查看和追踪你的所有订单 🐾</p>

    <th:block th:if="${orders}">
    <div style="display:flex;flex-direction:column;gap:1rem;">
        <th:block th:each="order : ${orders}">
        <a class="order-list-card" th:href="@{/orders/{id}/(id=${order.id})}" style="display:block;background:white;border-radius:16px;padding:1.2rem;box-shadow:0 2px 12px var(--shadow);text-decoration:none;color:inherit;transition:all 0.2s;" onmouseover="this.style.boxShadow='0 4px 20px var(--shadow-lg)'" onmouseout="this.style.boxShadow='0 2px 12px var(--shadow)'">
            <div class="order-list-main" style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <strong style="font-size:1rem;">订单 #[[${order.id}]]</strong>
                    <div style="font-size:0.8rem;color:var(--text-light);margin-top:0.2rem;">[[${#temporals.format(order.createdAt,'yyyy-MM-dd HH:mm')}]]</div>
                    <div style="font-size:0.85rem;color:var(--text);margin-top:0.3rem;">[[${orderItemCounts[order.id]}]] 件商品</div>
                </div>
                <div style="text-align:right;">
                    <span style="font-size:1.1rem;font-weight:700;color:var(--coral);">¥[[${#numbers.formatDecimal(order.total,1,2)}]]</span>
                    <div style="font-size:0.8rem;margin-top:0.2rem;padding:0.15rem 0.6rem;border-radius:50px;display:inline-block;"
                         th:styleappend="${order.status == 'paid' ? 'background:var(--mint-light);color:#2d6a4f;' : (order.status == 'cancelled' ? 'background:#FFE8EC;color:var(--coral);' : (order.status == 'completed' ? 'background:#E8F0FF;color:#1565C0;' : 'background:var(--cream);color:var(--text-light);'))}">
                        [[${order.statusDisplay}]]
                    </div>
                </div>
            </div>
        </a>
        </th:block>
    </div>
    </th:block><th:block th:if="${#lists.isEmpty(orders)}">
    <div style="text-align:center;padding:3rem;background:white;border-radius:24px;box-shadow:0 2px 12px var(--shadow);">
        <span style="font-size:4rem;display:block;margin-bottom:0.5rem;">📦</span>
        <p style="color:var(--text-light);margin-bottom:1rem;">还没有订单哦～</p>
        <a th:href="@{/products/}" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.5rem;background:linear-gradient(135deg,var(--pink),var(--coral));color:white;border-radius:50px;text-decoration:none;font-weight:600;">🛍️ 去购物</a>
    </div>
    </th:block>
</div>
    </th:block>
    <th:block layout:fragment="extraJs">

    </th:block>
</body>
</html>
