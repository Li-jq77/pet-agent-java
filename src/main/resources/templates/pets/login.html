<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{pets/base}">
<head>
    <title>🔐 登录 - 里脊球的宠物店</title>
    <th:block layout:fragment="extraCss">

    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
<section class="auth-section">
    <div class="auth-card">
        <h2>🔐 欢迎回来</h2>
        <p class="auth-subtitle">登录你的账号，解锁更多功能</p>

        <th:block th:if="${param.error != null}">
        <div class="alert alert-error">
            用户名或密码错误，请重试。
        </div>
        </th:block>

        <form method="post">
            <div class="form-group">
                <label for="id_username">用户名</label>
                <input type="text" name="username" id="id_username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">密码</label>
                <input type="password" name="password" id="id_password" placeholder="请输入密码" required>
            </div>
            <button type="submit" style="width:100%;padding:0.75rem;background:linear-gradient(135deg,var(--pink),var(--coral));color:white;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;">登 录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a th:href="@{/register/}">立即注册</a>
        </div>
    </div>
</section>
    </th:block>
    <th:block layout:fragment="extraJs">

    </th:block>
</body>
</html>
